# azure-pipelines-backend.yml
# Backend build, promotion, and deployment to separate namespaces
# in one shared EKS cluster.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - backend/*
      - backend/**
      - dev-chart/*
      - dev-chart/**
      - azure-pipelines-backend.yml

pr: none

parameters:
  - name: environment
    displayName: Target environment
    type: string
    default: dev
    values:
      - dev
      - qa
      - uat
      - prod

  - name: image_tag
    displayName: Existing Git commit SHA to promote (required for QA/UAT/PROD)
    type: string
    default: ''

variables:
  - group: DOCKERHUB_SECRETS

  - name: TARGET_ENV
    value: ${{ parameters.environment }}

pool:
  name: WSL-Agent-Pool

steps:
  - checkout: self
    clean: true

  # Validate the selected environment and promotion tag.
  - bash: |
      set -euo pipefail

      if [[ "$TARGET_ENV" != "dev" ]]; then
        if [[ ! "$IMAGE_INPUT" =~ ^[a-fA-F0-9]{40}$ ]]; then
          echo "##vso[task.logissue type=error]For QA, UAT, and PROD, provide the full 40-character Git commit SHA in the image_tag parameter."
          exit 1
        fi
      fi

      test -f "./dev-chart/values-${TARGET_ENV}.yaml"

      echo "Target environment: $TARGET_ENV"
      echo "Kubernetes namespace: app-${TARGET_ENV}"
    displayName: Validate parameters and environment values
    env:
      TARGET_ENV: $(TARGET_ENV)
      IMAGE_INPUT: ${{ parameters.image_tag }}

  # Configure AWS access and connect to EKS.
  - bash: |
      set -euo pipefail

      aws sts get-caller-identity

      aws eks describe-cluster \
        --name "$EKS_CLUSTER" \
        --region "$AWS_REGION" \
        --query 'cluster.status' \
        --output text

      aws eks update-kubeconfig \
        --region "$AWS_REGION" \
        --name "$EKS_CLUSTER"

      kubectl config current-context
      kubectl get --raw=/version
    displayName: Configure AWS access and connect to the shared EKS cluster
    env:
      AWS_REGION: $(AWS_REGION)
      EKS_CLUSTER_NAME: $(EKS_CLUSTER)

  # Create the target namespace if it does not exist.
  - bash: |
      set -euo pipefail

      NAMESPACE="app-${TARGET_ENV}"

      if kubectl get namespace "$NAMESPACE" >/dev/null 2>&1; then
        echo "Namespace $NAMESPACE already exists."
      else
        kubectl create namespace "$NAMESPACE"
      fi
    displayName: Create target namespace if needed
    env:
      TARGET_ENV: $(TARGET_ENV)

  # Authenticate with Docker Hub.
  - task: Docker@2
    displayName: Login to Docker Hub
    inputs:
      command: login
      containerRegistry: dockerhub-connection

  # Build and push the backend image only for DEV.
  - bash: |
      set -euo pipefail
      echo "Backend image repository: ${DEV_IMAGE}"
      echo "Git commit SHA: ${BUILD_SOURCEVERSION}"
      
      docker build \
        --file ./backend/Dockerfile \
        --tag "${DEV_IMAGE}:${BUILD_SOURCEVERSION}" \
        ./backend

      docker push "${DEV_IMAGE}:${BUILD_SOURCEVERSION}"

    displayName: Build and push DEV backend image
    condition: and(succeeded(), eq(variables['TARGET_ENV'], 'dev'))
    env:
      DEV_IMAGE: $(BACKEND_DEV_IMAGE)
      BUILD_SOURCEVERSION: $(Build.SourceVersion)

  # Select the source and destination image repositories.
  - bash: |
      set -euo pipefail

      case "$TARGET_ENV" in
        dev)
          SOURCE_IMAGE="$DEV_IMAGE"
          DEST_IMAGE="$DEV_IMAGE"
          IMAGE_TAG="$BUILD_SOURCEVERSION"
          ;;
        qa)
          SOURCE_IMAGE="$DEV_IMAGE"
          DEST_IMAGE="$QA_IMAGE"
          IMAGE_TAG="$IMAGE_INPUT"
          ;;
        uat)
          SOURCE_IMAGE="$QA_IMAGE"
          DEST_IMAGE="$UAT_IMAGE"
          IMAGE_TAG="$IMAGE_INPUT"
          ;;
        prod)
          SOURCE_IMAGE="$UAT_IMAGE"
          DEST_IMAGE="$PROD_IMAGE"
          IMAGE_TAG="$IMAGE_INPUT"
          ;;
        *)
          echo "Invalid environment: $TARGET_ENV"
          exit 1
          ;;
      esac

      echo "##vso[task.setvariable variable=SOURCE_IMAGE]$SOURCE_IMAGE"
      echo "##vso[task.setvariable variable=DEST_IMAGE]$DEST_IMAGE"
      echo "##vso[task.setvariable variable=IMAGE_TAG]$IMAGE_TAG"

      echo "Source image:      $SOURCE_IMAGE:$IMAGE_TAG"
      echo "Destination image: $DEST_IMAGE:$IMAGE_TAG"

    displayName: Select image repositories for the environment
    env:
      TARGET_ENV: $(TARGET_ENV)
      IMAGE_INPUT: ${{ parameters.image_tag }}
      BUILD_SOURCEVERSION: $(Build.SourceVersion)
      DEV_IMAGE: $(BACKEND_DEV_IMAGE)
      QA_IMAGE: $(BACKEND_QA_IMAGE)
      UAT_IMAGE: $(BACKEND_UAT_IMAGE)
      PROD_IMAGE: $(BACKEND_PROD_IMAGE)

  # Promote the existing image for QA, UAT, and PROD.
  - bash: |
      set -euo pipefail

      docker pull "$SOURCE_IMAGE:$IMAGE_TAG"

      if [[ "$SOURCE_IMAGE" != "$DEST_IMAGE" ]]; then
        docker tag \
          "$SOURCE_IMAGE:$IMAGE_TAG" \
          "$DEST_IMAGE:$IMAGE_TAG"

        docker push "$DEST_IMAGE:$IMAGE_TAG"
      fi

      docker manifest inspect "$DEST_IMAGE:$IMAGE_TAG" >/dev/null

      echo "Verified image: $DEST_IMAGE:$IMAGE_TAG"

    displayName: Promote and verify backend image
    condition: succeeded()
    env:
      SOURCE_IMAGE: $(SOURCE_IMAGE)
      DEST_IMAGE: $(DEST_IMAGE)
      IMAGE_TAG: $(IMAGE_TAG)

  # Create or update the Docker Hub pull secret.
  - bash: |
      set -euo pipefail

      test -n "$DH_USER"
      test -n "$DH_TOKEN"

      kubectl create secret docker-registry dockerhub-secret \
        --namespace="app-${TARGET_ENV}" \
        --docker-server=https://index.docker.io/v1/ \
        --docker-username="$DH_USER" \
        --docker-password="$DH_TOKEN" \
        --dry-run=client -o yaml | kubectl apply -f -

    displayName: Configure Docker Hub pull secret
    env:
      TARGET_ENV: $(TARGET_ENV)
      DH_USER: $(DOCKER_USERNAME)
      DH_TOKEN: $(DOCKER_TOKEN)

  # Validate the Helm chart.
  - bash: |
      set -euo pipefail

      helm lint ./dev-chart -f "$VALUES_FILE"

    displayName: Validate Helm chart
    env:
      VALUES_FILE: ./dev-chart/values-$(TARGET_ENV).yaml

  # Deploy the backend.
  - bash: |
      set -euo pipefail

      helm upgrade --install employee-app ./dev-chart \
        --namespace "app-${TARGET_ENV}" \
        --create-namespace \
        -f "$VALUES_FILE" \
        --set frontend.enabled=false \
        --set backend.enabled=true \
        --set database.enabled=false \
        --set configMap.enabled=true \
        --set secret.enabled=true \
        --set ingress.enabled=false \
        --set-string backend.image.repository="$DEST_IMAGE" \
        --set-string backend.image.tag="$IMAGE_TAG" \
        --wait \
        --timeout 10m

    displayName: Deploy backend to the selected environment
    env:
      TARGET_ENV: $(TARGET_ENV)
      VALUES_FILE: ./dev-chart/values-$(TARGET_ENV).yaml
      DEST_IMAGE: $(DEST_IMAGE)
      IMAGE_TAG: $(IMAGE_TAG)

  # Verify the backend deployment.
  - bash: |
      set -euo pipefail

      echo "Backend deployment status:"
      kubectl rollout status deployment/backend \
        -n "app-${TARGET_ENV}" \
        --timeout=180s

      echo "Backend image:"
      kubectl get deployment backend \
        -n "app-${TARGET_ENV}" \
        -o jsonpath='{.spec.template.spec.containers[0].image}'

      echo ""
      kubectl get deployments,pods,services \
        -n "app-${TARGET_ENV}" || true

      kubectl get events \
        -n "app-${TARGET_ENV}" \
        --sort-by=.metadata.creationTimestamp | tail -n 30 || true

    displayName: Check backend deployment
    condition: always()
    env:
      TARGET_ENV: $(TARGET_ENV)