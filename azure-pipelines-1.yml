# azure-pipelines-frontend.yml
# Frontend build, promotion, and deployment to separate namespaces
# in one shared EKS cluster.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - frontend/*
      - frontend/**
      - dev-chart/*
      - dev-chart/**
      - azure-pipelines-frontend.yml

pr: none

parameters:
  - name: environment
    displayName: Target environment
    type: string
    default: dev
    values:
      - dev
      - qa
      - uat
      - prod

  - name: image_tag
    displayName: Existing Git commit SHA to promote (required for QA/UAT/PROD)
    type: string
    default: ''

variables:
- group: DOCKERHUB_SECRETS

- name: TARGET_ENV
  value: ${{ parameters.environment }}

pool:
  name: WSL-Agent-Pool

steps:

  - checkout: self
    clean: true

  # Validate environment and promotion SHA.
  - bash: |
      set -euo pipefail

      if [[ "$TARGET_ENV" != "dev" ]]; then
        if [[ ! "$IMAGE_INPUT" =~ ^[a-fA-F0-9]{40}$ ]]; then
          echo "##vso[task.logissue type=error]Provide the full 40-character frontend image Git commit SHA."
          exit 1
        fi
      fi

      VALUES_FILE="./dev-chart/values-${TARGET_ENV}.yaml"

      if [[ ! -f "$VALUES_FILE" ]]; then
        echo "##vso[task.logissue type=error]Values file not found: $VALUES_FILE"
        exit 1
      fi

      echo "Target environment: $TARGET_ENV"
      echo "Target namespace: app-${TARGET_ENV}"
      echo "Values file: $VALUES_FILE"

    displayName: Validate parameters and environment values
    env:
      TARGET_ENV: $(TARGET_ENV)
      IMAGE_INPUT: ${{ parameters.image_tag }}

  # Configure AWS and connect to EKS.
  - bash: |
      set -euo pipefail

      aws sts get-caller-identity

      echo "Checking EKS cluster..."

      aws eks describe-cluster \
        --name "$EKS_CLUSTER_NAME" \
        --region "$AWS_REGION" \
        --query 'cluster.status' \
        --output text

      aws eks update-kubeconfig \
        --region "$AWS_REGION" \
        --name "$EKS_CLUSTER_NAME"

      kubectl config current-context
      kubectl get --raw=/version

    displayName: Configure AWS access and connect to the shared EKS cluster
    env:
      AWS_REGION: $(AWS_REGION)
      EKS_CLUSTER_NAME: $(EKS_CLUSTER)

  # Create namespace.
  - bash: |
      set -euo pipefail

      NAMESPACE="app-${TARGET_ENV}"

      if kubectl get namespace "$NAMESPACE" >/dev/null 2>&1; then
        echo "Namespace $NAMESPACE already exists."
      else
        kubectl create namespace "$NAMESPACE"
      fi

    displayName: Create target namespace if needed
    env:
      TARGET_ENV: $(TARGET_ENV)

  # Docker Hub authentication.
  - task: Docker@2
    displayName: Login to Docker Hub
    inputs:
      command: login
      containerRegistry: dockerhub-connection

  # Build and push frontend image only for DEV.
  - bash: |
      set -euo pipefail

      IMAGE="$DEV_IMAGE"
      TAG="$BUILD_SOURCEVERSION"

      if [[ -z "$IMAGE" ]]; then
        echo "ERROR: DEV_IMAGE is empty"
        exit 1
      fi

      echo "Building frontend image: ${IMAGE}:${TAG}"

      docker build \
        --file ./frontend/Dockerfile \
        --tag "${IMAGE}:${TAG}" \
        ./frontend

      docker push "${IMAGE}:${TAG}"

    displayName: Build and push DEV frontend image
    condition: and(succeeded(), eq(variables['TARGET_ENV'], 'dev'))
    env:
      DEV_IMAGE: $(FRONTEND_DEV_IMAGE)
      BUILD_SOURCEVERSION: $(Build.SourceVersion)

  # Select source and destination image repositories.
  - bash: |
      set -euo pipefail

      case "$TARGET_ENV" in
        dev)
          SOURCE_IMAGE="$DEV_IMAGE"
          DEST_IMAGE="$DEV_IMAGE"
          IMAGE_TAG="$BUILD_SOURCEVERSION"
          ;;

        qa)
          SOURCE_IMAGE="$DEV_IMAGE"
          DEST_IMAGE="$QA_IMAGE"
          IMAGE_TAG="$IMAGE_INPUT"
          ;;

        uat)
          SOURCE_IMAGE="$QA_IMAGE"
          DEST_IMAGE="$UAT_IMAGE"
          IMAGE_TAG="$IMAGE_INPUT"
          ;;

        prod)
          SOURCE_IMAGE="$UAT_IMAGE"
          DEST_IMAGE="$PROD_IMAGE"
          IMAGE_TAG="$IMAGE_INPUT"
          ;;

        *)
          echo "Invalid environment: $TARGET_ENV"
          exit 1
          ;;
      esac

      echo "##vso[task.setvariable variable=SOURCE_IMAGE]$SOURCE_IMAGE"
      echo "##vso[task.setvariable variable=DEST_IMAGE]$DEST_IMAGE"
      echo "##vso[task.setvariable variable=IMAGE_TAG]$IMAGE_TAG"

      echo "Source image: $SOURCE_IMAGE:$IMAGE_TAG"
      echo "Destination image: $DEST_IMAGE:$IMAGE_TAG"

    displayName: Select frontend image repositories
    env:
      TARGET_ENV: $(TARGET_ENV)
      IMAGE_INPUT: ${{ parameters.image_tag }}
      BUILD_SOURCEVERSION: $(Build.SourceVersion)
      DEV_IMAGE: $(FRONTEND_DEV_IMAGE)
      QA_IMAGE: $(FRONTEND_QA_IMAGE)
      UAT_IMAGE: $(FRONTEND_UAT_IMAGE)
      PROD_IMAGE: $(FRONTEND_PROD_IMAGE)

  # Promote existing image without rebuilding.
  - bash: |
      set -euo pipefail

      docker pull "$SOURCE_IMAGE:$IMAGE_TAG"

      if [[ "$SOURCE_IMAGE" != "$DEST_IMAGE" ]]; then

        docker tag \
          "$SOURCE_IMAGE:$IMAGE_TAG" \
          "$DEST_IMAGE:$IMAGE_TAG"

        docker push "$DEST_IMAGE:$IMAGE_TAG"

        echo "Frontend image promoted successfully."

      else
        echo "DEV frontend image was already built and pushed."
      fi

      docker manifest inspect "$DEST_IMAGE:$IMAGE_TAG" >/dev/null

      echo "Verified image: $DEST_IMAGE:$IMAGE_TAG"

    displayName: Promote and verify frontend image
    env:
      SOURCE_IMAGE: $(SOURCE_IMAGE)
      DEST_IMAGE: $(DEST_IMAGE)
      IMAGE_TAG: $(IMAGE_TAG)

  # Configure Docker Hub pull secret.
  - bash: |
      set -euo pipefail

      test -n "$DH_USER"
      test -n "$DH_TOKEN"

      kubectl create secret docker-registry dockerhub-secret \
        --namespace="app-${TARGET_ENV}" \
        --docker-server=https://index.docker.io/v1/ \
        --docker-username="$DH_USER" \
        --docker-password="$DH_TOKEN" \
        --dry-run=client -o yaml | kubectl apply -f -

    displayName: Configure Docker Hub pull secret
    env:
      TARGET_ENV: $(TARGET_ENV)
      DH_USER: $(DOCKER_USERNAME)
      DH_TOKEN: $(DOCKER_TOKEN)

  # Validate Helm chart.
  - bash: |
      set -euo pipefail

      helm lint ./dev-chart -f "$VALUES_FILE"

    displayName: Validate Helm chart
    env:
      VALUES_FILE: ./dev-chart/values-$(TARGET_ENV).yaml

  # Deploy frontend to selected environment.
  - bash: |
      set -euo pipefail

      test -n "$DEST_IMAGE"
      test -n "$IMAGE_TAG"

      echo "Deploying frontend image: ${DEST_IMAGE}:${IMAGE_TAG}"

      helm upgrade --install employee-app ./dev-chart \
        --namespace "app-${TARGET_ENV}" \
        --create-namespace \
        -f "$VALUES_FILE" \
        --set frontend.enabled=true \
        --set backend.enabled=false \
        --set database.enabled=false \
        --set ingress.enabled=true \
        --set configMap.enabled=false \
        --set secret.enabled=false \
        --set-string frontend.image.repository="$DEST_IMAGE" \
        --set-string frontend.image.tag="$IMAGE_TAG" \
        --wait \
        --timeout 10m

    displayName: Deploy frontend to the selected environment
    env:
      TARGET_ENV: $(TARGET_ENV)
      VALUES_FILE: ./dev-chart/values-$(TARGET_ENV).yaml
      DEST_IMAGE: $(DEST_IMAGE)
      IMAGE_TAG: $(IMAGE_TAG)

  # Verify deployment.
  - bash: |
      set -euo pipefail

      kubectl get deployments,pods,services \
        -n "app-${TARGET_ENV}" || true

      kubectl get events \
        -n "app-${TARGET_ENV}" \
        --sort-by=.metadata.creationTimestamp | tail -n 30 || true

    displayName: Check frontend deployment
    condition: always()
    env:
      TARGET_ENV: $(TARGET_ENV)